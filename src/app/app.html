<main class="shef-app-container">
  <button 
    class="theme-toggle" 
    (click)="themeService.toggle()" 
    [attr.aria-label]="'Switch to ' + (themeService.theme() === 'light' ? 'dark' : 'light') + ' mode'"
  >
    {{ themeService.theme() === 'light' ? '🌙' : '☀️' }}
  </button>

  <router-outlet />
</main>
